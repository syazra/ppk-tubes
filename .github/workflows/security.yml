name: Security checks

on:
  pull_request:
  push:
  schedule:
    - cron: '0 1 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: zip, sqlite3, pdo_sqlite, gd
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --locked
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm run build
      - run: php vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: php vendor/phpunit/phpunit/phpunit --do-not-cache-result
      - run: node --test tests/JavaScript/*.test.js
